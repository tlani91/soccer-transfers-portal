<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transfer Wire</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,400..800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --field:   #0B0E13;
    --panel:   #121721;
    --rule:    #1C2230;
    --type:    #E9ECF1;
    --mute:    #6E7784;

    /* Signal hues are functional: each means one thing about how
       solid a rumour is. Nothing else on the page uses them. */
    --go:      #34D399;  /* here we go / done deal */
    --wait:    #6BA6FF;  /* medical booked */
    --kill:    #FF5F5F;  /* denied */
    --scoop:   #FFB627;  /* exclusive */

    --gutter:  20px;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    background: var(--field);
    color: var(--type);
    font-family: "Archivo", -apple-system, "Helvetica Neue", Arial, sans-serif;
    font-variation-settings: "wdth" 100;
    -webkit-font-smoothing: antialiased;
  }

  .mono {
    font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-feature-settings: "tnum" 1;
  }

  :focus-visible {
    outline: 2px solid var(--scoop);
    outline-offset: 2px;
    border-radius: 3px;
  }

  /* ── Shell ────────────────────────────────────────────────────
     Phone and tablet: one column. `.side` is display:contents so its
     children become direct children of .shell — that's what lets the
     filter bar stick to the top of the whole page rather than only
     to the height of the header block. Desktop turns .side back into
     a real element and the layout becomes two columns. */

  .shell {
    max-width: 800px;
    margin: 0 auto;
    padding: 0 var(--gutter);
  }
  .side { display: contents; }

  /* ── Masthead ─────────────────────────────────────────────── */

  .masthead {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 16px;
    padding-top: 26px;
  }

  h1 {
    margin: 0;
    font-size: 30px;
    line-height: 0.95;
    font-weight: 800;
    font-variation-settings: "wdth" 78, "wght" 800;
    letter-spacing: 0.02em;
    text-transform: uppercase;
  }
  h1 em { font-style: normal; color: var(--mute); }

  .status {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 11px;
    color: var(--mute);
    letter-spacing: 0.04em;
    white-space: nowrap;
  }
  .pip {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--go);
    animation: pip 2.4s ease-out infinite;
  }
  .pip.dead { background: var(--kill); animation: none; }
  @keyframes pip {
    0%   { box-shadow: 0 0 0 0 rgba(52,211,153,0.55); }
    70%  { box-shadow: 0 0 0 7px rgba(52,211,153,0); }
    100% { box-shadow: 0 0 0 0 rgba(52,211,153,0); }
  }

  /* ── Page nav (shared with transfers.html) ────────────────── */

  nav {
    display: flex;
    gap: 18px;
    padding: 18px 0 0;
  }
  nav a {
    font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace;
    font-size: 10px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--mute);
    text-decoration: none;
    padding-bottom: 5px;
    border-bottom: 1px solid transparent;
  }
  nav a:hover { color: var(--type); }
  nav a[aria-current="page"] {
    color: var(--type);
    border-bottom-color: var(--go);
  }

  /* ── Signature: 24h activity rail ─────────────────────────── */

  .pulse-block { padding: 20px 0 18px; }

  .rail {
    display: flex;
    align-items: flex-end;
    gap: 2px;
    height: 28px;
    margin-bottom: 8px;
  }
  .tick {
    flex: 1 1 0;
    min-width: 0;
    height: 2px;
    border-radius: 1px;
    background: var(--rule);
    transition: height .5s cubic-bezier(.2,.7,.3,1), opacity .15s linear;
  }

  /* Hovering the rail pulls the read bucket forward; the legend below
     carries the actual number, so this only has to point. */
  .rail:hover .tick { opacity: .4; }
  .rail:hover .tick.hot { opacity: 1; }

  .rail-legend {
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--mute);
  }

  /* ── Filters ──────────────────────────────────────────────── */

  .filters {
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    gap: 10px;
    align-items: center;
    background: var(--field);
    border-bottom: 1px solid var(--rule);
    margin: 0 calc(var(--gutter) * -1);
    padding: 10px var(--gutter);
  }

  #search {
    flex: 1 1 200px;
    min-width: 0;
    height: 34px;
    background: var(--panel);
    border: 1px solid var(--rule);
    border-radius: 4px;
    color: var(--type);
    padding: 0 11px;
    font-family: inherit;
    font-size: 16px; /* 16px keeps iOS Safari from zooming on focus */
  }
  #search::placeholder { color: var(--mute); }
  #search:focus { outline: none; border-color: var(--mute); }

  #chips {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
    mask-image: linear-gradient(90deg, #000 calc(100% - 24px), transparent);
  }
  #chips::-webkit-scrollbar { display: none; }

  .chip {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 8px;
    background: none;
    border: 1px solid var(--rule);
    border-radius: 3px;
    color: var(--mute);
    font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace;
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 7px 11px;
    cursor: pointer;
    white-space: nowrap;
    transition: color .15s, border-color .15s, background .15s;
    -webkit-tap-highlight-color: transparent;
  }
  .chip:hover { color: var(--type); }
  .chip[aria-pressed="true"] {
    color: var(--field);
    background: var(--type);
    border-color: var(--type);
  }
  .count { display: none; opacity: 0.6; }

  /* ── Feed ─────────────────────────────────────────────────── */

  .feed { padding: 6px 0 72px; }

  .item {
    display: flex;
    gap: 14px;
    padding: 15px 10px;
    margin: 0 -10px;
    border-bottom: 1px solid var(--rule);
    text-decoration: none;
    color: inherit;
    transition: background .15s;
    -webkit-tap-highlight-color: transparent;
  }
  .item:hover { background: var(--panel); }

  .stamp {
    flex: 0 0 46px;
    padding-top: 2px;
    font-size: 11px;
    color: var(--mute);
    letter-spacing: 0.02em;
    transition: color .15s;
  }
  .item:hover .stamp { color: var(--type); }

  .body { flex: 1 1 auto; min-width: 0; }

  .meta {
    display: flex;
    align-items: center;
    gap: 7px;
    margin-bottom: 5px;
  }
  .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    flex: 0 0 auto;
  }
  /* Unverified chatter gets a hollow dot; corroborated is filled. */
  .dot.hollow { background: none !important; box-shadow: inset 0 0 0 1.5px var(--mute); }

  .signal {
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.13em;
    text-transform: uppercase;
  }
  .from {
    font-size: 10px;
    letter-spacing: 0.13em;
    text-transform: uppercase;
    color: var(--mute);
    margin-left: auto;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .headline {
    margin: 0 0 4px;
    font-size: 16.5px;
    font-weight: 600;
    font-variation-settings: "wdth" 92, "wght" 600;
    line-height: 1.28;
    letter-spacing: -0.005em;
  }
  .item:hover .headline { text-decoration: underline; text-underline-offset: 3px; }

  .desc {
    margin: 0;
    font-size: 13px;
    line-height: 1.45;
    color: var(--mute);
  }
  .byline {
    margin: 5px 0 0;
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--mute);
    opacity: 0.75;
  }

  .notice {
    padding: 64px 0;
    text-align: center;
    font-size: 13px;
    line-height: 1.7;
    color: var(--mute);
  }
  .notice strong {
    display: block;
    font-size: 15px;
    font-weight: 600;
    color: var(--type);
    margin-bottom: 6px;
  }
  .notice.bad strong { color: var(--kill); }

  /* ── Phone ────────────────────────────────────────────────── */

  @media (max-width: 640px) {
    :root { --gutter: 16px; }
    .masthead { padding-top: 20px; }
    h1 { font-size: 25px; }
    .pulse-block { padding: 16px 0 14px; }
    .filters { flex-direction: column; align-items: stretch; gap: 8px; }
    #search { flex: none; width: 100%; }
    .item { gap: 11px; }
    .stamp { flex-basis: 40px; }
    .headline { font-size: 15.5px; }
  }

  /* ── Desktop ──────────────────────────────────────────────────
     Two columns: a sticky control column that stays put while the
     wire scrolls, and the feed capped at a readable measure so it
     doesn't stretch into unreadable lines on a wide monitor. */

  @media (min-width: 1000px) {
    :root { --gutter: 40px; }

    .shell {
      max-width: 1240px;
      display: grid;
      grid-template-columns: 260px minmax(0, 1fr);
      column-gap: 64px;
      align-items: start;
    }

    .side {
      display: flex;
      flex-direction: column;
      position: sticky;
      top: 0;
      max-height: 100vh;
      overflow-y: auto;
      scrollbar-width: none;
      padding: 44px 0 32px;
    }
    .side::-webkit-scrollbar { display: none; }

    .masthead {
      display: block;
      padding-top: 0;
    }
    h1 { font-size: 40px; }
    .status { margin-top: 14px; }

    .pulse-block {
      padding: 26px 0 0;
      margin-top: 26px;
      border-top: 1px solid var(--rule);
    }
    .rail { gap: 1px; height: 34px; }
    nav { flex-direction: column; gap: 10px; padding: 22px 0 0; }
    nav a { width: fit-content; }

    /* Filters move into the column and unwind into a vertical list —
       no stickiness of their own, the whole column is already sticky. */
    .filters {
      position: static;
      flex-direction: column;
      align-items: stretch;
      gap: 14px;
      background: none;
      border-bottom: 0;
      border-top: 1px solid var(--rule);
      margin: 26px 0 0;
      padding: 26px 0 0;
    }
    #search { flex: none; width: 100%; }
    #chips {
      flex-direction: column;
      gap: 2px;
      overflow: visible;
      mask-image: none;
    }
    .chip {
      width: 100%;
      justify-content: space-between;
      border: 0;
      border-radius: 4px;
      padding: 7px 10px;
      letter-spacing: 0.08em;
    }
    .chip:hover { background: var(--panel); }
    .count { display: inline; }

    .feed { padding: 44px 0 96px; }
    .item { padding: 17px 12px; margin: 0 -12px; gap: 18px; }
    .stamp { flex-basis: 54px; font-size: 11.5px; }
    .headline { font-size: 17.5px; }
    .desc { font-size: 13.5px; }
    .notice { padding: 96px 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
<script data-goatcounter="https://tlani91.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</head>
<body>

<div class="shell">

  <aside class="side">
    <div class="masthead">
      <h1>Transfer<br><em>Wire</em></h1>
      <div class="status">
        <span class="pip" id="pip"></span>
        <span id="updated" class="mono">connecting</span>
      </div>
    </div>

    <nav>
      <a href="dashboard.html" aria-current="page">Rumour wire</a>
      <a href="transfers.html">Completed deals</a>
      <a href="scores.html">Scores</a>
    </nav>

    <div class="pulse-block">
      <div class="rail" id="rail" aria-hidden="true"></div>
      <div class="rail-legend">
        <span class="mono" id="railLabel">last 24 hours</span>
      </div>
    </div>

    <div class="filters">
      <input id="search" type="search" placeholder="Search players, clubs" aria-label="Search rumours">
      <div id="chips" role="group" aria-label="Filter by source"></div>
    </div>
  </aside>

  <main class="feed" id="main" aria-label="Transfer rumours">
    <div class="notice"><strong>Standing by</strong>Waiting on the first fetch cycle.</div>
  </main>

</div>

<script>
const SOURCES = [
  { id: 'all',        name: 'All' },
  { id: 'espn_fc',    name: 'ESPN FC' },
  { id: 'ornstein',   name: 'Ornstein' },
  { id: 'jacobs',     name: 'Jacobs' },
  { id: 'flashscore', name: 'Flashscore' },
  { id: 'ddl',        name: 'Deadline Day' },
  { id: 'romano',     name: 'Romano' },
];

const SIGNALS = {
  go:      { label: 'Here we go',     color: 'var(--go)' },
  done:    { label: 'Done deal',      color: 'var(--go)' },
  medical: { label: 'Medical booked', color: 'var(--wait)' },
  denied:  { label: 'Denied',         color: 'var(--kill)' },
  scoop:   { label: 'Exclusive',      color: 'var(--scoop)' },
  rumour:  { label: 'Rumour',         color: 'var(--mute)' },
};

let activeSources = new Set(['all']);
let searchTerm = '';
let allItems = [];

/* ── Filters ─────────────────────────────────────────────── */

function toggleSource(id) {
  if (id === 'all') {
    activeSources = new Set(['all']);
  } else {
    activeSources.delete('all');
    activeSources.has(id) ? activeSources.delete(id) : activeSources.add(id);
    if (!activeSources.size) activeSources = new Set(['all']);
  }
  syncChips();
  render();
}

function syncChips() {
  document.querySelectorAll('.chip').forEach(c => {
    c.setAttribute('aria-pressed', activeSources.has(c.dataset.id));
  });
}

const chipsEl = document.getElementById('chips');
SOURCES.forEach(s => {
  const chip = document.createElement('button');
  chip.type = 'button';
  chip.className = 'chip';
  chip.dataset.id = s.id;
  chip.setAttribute('aria-pressed', s.id === 'all');
  chip.innerHTML = '<span></span><span class="count"></span>';
  chip.firstChild.textContent = s.name;
  chip.addEventListener('click', () => toggleSource(s.id));
  chipsEl.appendChild(chip);
});

/* Counts ignore the source filter and honour the search box, so the
   column answers "who's got something on this player right now". */
function updateCounts(searchMatched) {
  document.querySelectorAll('.chip').forEach(c => {
    const id = c.dataset.id;
    const n = id === 'all'
      ? searchMatched.length
      : searchMatched.filter(i => i.source_id === id).length;
    c.querySelector('.count').textContent = n || '';
  });
}

document.getElementById('search').addEventListener('input', (e) => {
  searchTerm = e.target.value.toLowerCase();
  render();
});

/* ── Classification ──────────────────────────────────────── */

function detectSignal(text) {
  const t = text.toLowerCase();
  if (t.includes('here we go')) return 'go';
  if (t.includes('done deal') || t.includes('confirmed') || t.includes('official')) return 'done';
  if (t.includes('medical')) return 'medical';
  if (t.includes('denies') || t.includes('rules out') || t.includes('not interested') ||
      t.includes('cools')  || t.includes('distances')) return 'denied';
  if (t.includes('exclusive')) return 'scoop';
  return 'rumour';
}

function timeAgo(epochSeconds, isApprox) {
  if (!epochSeconds) return '';
  if (isApprox) return '~';
  const diff = Math.max(0, (Date.now() / 1000) - epochSeconds);
  if (diff < 60)    return 'now';
  if (diff < 3600)  return Math.floor(diff / 60) + 'm';
  if (diff < 86400) return Math.floor(diff / 3600) + 'h';
  return Math.floor(diff / 86400) + 'd';
}

/* ── Activity rail: 48 half-hour buckets across the last 24h ─ */

const BUCKETS = 48;
const PRIORITY = ['go', 'done', 'denied', 'scoop', 'medical', 'rumour'];

const railEl = document.getElementById('rail');
const ticks = [];
for (let i = 0; i < BUCKETS; i++) {
  const t = document.createElement('div');
  t.className = 'tick';
  railEl.appendChild(t);
  ticks.push(t);
}

/* Kept from the last draw so the hover readout doesn't recount. */
let railCounts = new Array(BUCKETS).fill(0);
let railStart = Date.now() / 1000 - 86400;
let railLabelText = 'last 24 hours';
let hoverBucket = null;

function drawRail() {
  const now = Date.now() / 1000;
  const span = 86400;
  const counts = new Array(BUCKETS).fill(0);
  const kinds  = Array.from({ length: BUCKETS }, () => new Set());

  allItems.forEach(it => {
    if (!it.epoch || it.approx_time) return;
    const age = now - it.epoch;
    if (age < 0 || age > span) return;
    const i = Math.min(BUCKETS - 1, BUCKETS - 1 - Math.floor(age / (span / BUCKETS)));
    counts[i]++;
    kinds[i].add(detectSignal((it.title || '') + ' ' + (it.description || '')));
  });

  const peak = Math.max(1, ...counts);
  const total = counts.reduce((a, b) => a + b, 0);
  const max = railEl.clientHeight || 28;

  ticks.forEach((t, i) => {
    t.style.height = (counts[i] ? 3 + (counts[i] / peak) * (max - 3) : 2) + 'px';
    const kind = PRIORITY.find(k => kinds[i].has(k));
    t.style.background = counts[i]
      ? (kind && kind !== 'rumour' ? SIGNALS[kind].color : 'var(--mute)')
      : 'var(--rule)';
  });

  railCounts = counts;
  railStart = now - span;
  railLabelText =
    total ? 'last 24 hours · ' + total + ' filed' : 'last 24 hours · quiet';

  /* The 60s refresh lands while the pointer may still be on the rail. Writing
     the total here unconditionally left the tick highlighted but the legend
     describing the whole day, so re-render the hovered bucket instead. */
  setLabel();
}

function setLabel() {
  document.getElementById('railLabel').textContent =
    hoverBucket === null ? railLabelText : bucketText(hoverBucket);
}

function bucketText(i) {
  const n = railCounts[i];
  const from = railStart + i * BUCKET_SECS;
  return clockAt(from) + '–' + clockAt(from + BUCKET_SECS) + ' · ' +
    (n ? n + (n === 1 ? ' rumour' : ' rumours') + ' filed' : 'nothing filed');
}

/* Hover readout. The pointer is tracked on the rail rather than on each
   tick: an empty bucket is only 2px tall, so its own hover box is far
   too small to hit. */

const BUCKET_SECS = 86400 / BUCKETS;

function clockAt(epoch) {
  return new Date(epoch * 1000)
    .toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

railEl.addEventListener('mousemove', e => {
  const rect = railEl.getBoundingClientRect();
  if (!rect.width) return;
  const i = Math.min(BUCKETS - 1,
    Math.max(0, Math.floor(((e.clientX - rect.left) / rect.width) * BUCKETS)));
  if (i === hoverBucket) return;   // most moves stay inside the same 5px tick

  if (hoverBucket !== null) ticks[hoverBucket].classList.remove('hot');
  ticks[i].classList.add('hot');
  hoverBucket = i;
  setLabel();
});

railEl.addEventListener('mouseleave', () => {
  if (hoverBucket !== null) ticks[hoverBucket].classList.remove('hot');
  hoverBucket = null;
  setLabel();
});

/* ── Feed ────────────────────────────────────────────────── */

function render() {
  const main = document.getElementById('main');

  const searchMatched = searchTerm
    ? allItems.filter(i => ((i.title || '') + ' ' + (i.description || '')).toLowerCase().includes(searchTerm))
    : allItems;
  updateCounts(searchMatched);

  const items = activeSources.has('all')
    ? searchMatched
    : searchMatched.filter(i => activeSources.has(i.source_id));

  if (!items.length) {
    main.innerHTML = '<div class="notice"><strong>Nothing here yet</strong>' +
      'Widen the search or switch a source back on.</div>';
    return;
  }

  main.innerHTML = '';
  items.forEach(it => {
    const sig = SIGNALS[detectSignal((it.title || '') + ' ' + (it.description || ''))];
    const hollow = sig.label === 'Rumour' ? ' hollow' : '';

    const row = document.createElement('a');
    row.className = 'item';
    row.href = it.link;
    row.target = '_blank';
    row.rel = 'noopener';
    row.innerHTML = `
      <div class="stamp mono">${timeAgo(it.epoch, it.approx_time)}</div>
      <div class="body">
        <div class="meta">
          <span class="dot${hollow}" style="background:${sig.color}"></span>
          <span class="signal mono" style="color:${sig.color}">${sig.label}</span>
          <span class="from mono">${escapeHtml(it.source_name)}</span>
        </div>
        <p class="headline">${escapeHtml(it.title)}</p>
        <p class="desc">${escapeHtml(it.description)}</p>
        ${it.byline ? `<p class="byline mono">${escapeHtml(it.byline)}</p>` : ''}
      </div>
    `;
    main.appendChild(row);
  });
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}

/* ── Data ────────────────────────────────────────────────── */

async function loadData() {
  const updatedEl = document.getElementById('updated');
  const pipEl = document.getElementById('pip');
  try {
    const res = await fetch('rumors_data.json?t=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    allItems = data.items || [];
    const d = new Date(data.last_updated);
    pipEl.classList.remove('dead');
    updatedEl.textContent = 'updated ' + d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    drawRail();
    render();
  } catch (err) {
    pipEl.classList.add('dead');
    updatedEl.textContent = 'offline';
    document.getElementById('main').innerHTML =
      '<div class="notice bad"><strong>Feed unreachable</strong>' +
      'rumors_data.json didn\'t respond. Check your connection, ' +
      'and that the GitHub Action has run at least once.</div>';
  }
}

/* The rail's tick heights are pixel-based, so redraw when the column
   swaps between the phone and desktop layouts. */
