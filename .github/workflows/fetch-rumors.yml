name: Fetch Transfer Rumors

"on":
  schedule:
    # Offset from :00/:10/:20/etc on purpose -- GitHub documents that
    # schedules landing on round numbers are more likely to be delayed
    # since that's when everyone else's crons fire too. GitHub's own
    # scheduler can still drift several minutes late regardless -- that's
    # a known platform limitation, not something this offset fully fixes.
    - cron: '4,14,24,34,44,54 * * * *'
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

permissions:
  contents: write   # required so the workflow can commit rumors_data.json back

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch latest rumors
        run: python3 transfer_rumors_fetch.py --once

      - name: Commit updated data (if anything changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add rumors_data.json
          git diff --staged --quiet || git commit -m "Update transfer rumors data"
          git pull --rebase
          git push
